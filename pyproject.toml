[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-psr"
dynamic = ["version"]
description = "Parser y herramientas para el formato PULSAR (.psr)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
psr = "pulsar:main"

[tool.setuptools]
py-modules = ["pulsar"]

[tool.setuptools.dynamic]
version = {attr = "pulsar.__version__"}
