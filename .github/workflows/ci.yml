name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  parser-sync:
    name: Parser sync (landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que landing/pulsar.py es identico a pulsar.py
        run: |
          if ! diff -q pulsar.py landing/pulsar.py; then
            echo "::error::landing/pulsar.py no es identico a pulsar.py. Sincronizalo con: cp pulsar.py landing/pulsar.py"
            exit 1
          fi

  pre-commit:
    name: Pre-commit (hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ejecutar tests unitarios
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          python -m pulsar version
          python -m pulsar parse -f ejemplo.psr > /dev/null

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - name: Verificar assets locales referenciados por la landing
        run: |
          cd landing
          missing=0
          for ref in $(grep -oE '\./assets/[A-Za-z0-9_./-]+' index.html); do
            if [ ! -f "$ref" ]; then echo "FALTA: $ref"; missing=1; fi
          done
          exit $missing
      - run: python -m build

      - name: Validar metadatos del paquete (twine check)
        run: |
          pip install twine
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
