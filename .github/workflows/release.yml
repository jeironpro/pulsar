name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Tests previos al release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar tests unitarios
        run: python -m unittest discover -s tests -v

  release:
    name: Build y GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Construir paquete (sdist + wheel)
        run: |
          pip install build
          python -m build

      - name: Crear GitHub Release con artefactos
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
