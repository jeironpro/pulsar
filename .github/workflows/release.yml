name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests previos al release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar tests unitarios
        run: python -m unittest discover -s tests -v

  release:
    name: Build y GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Construir paquete (sdist + wheel)
        run: |
          pip install build
          python -m build

      - name: Subir artefactos de distribucion
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Crear GitHub Release con artefactos
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    # Publica en PyPI real mediante trusted publishing (OIDC), sin tokens.
    # Requiere configurar el publisher una sola vez en PyPI:
    #   https://pypi.org/manage/project/pulsar-psr/settings/ -> Publishing ->
    #   "Add a new pending publisher" -> owner: jeironpro, repository: pulsar,
    #   workflow name: release.yml (el nombre del archivo, no el del job).
    name: Publicar en PyPI (trusted publishing)
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publicar sdist y wheel en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
